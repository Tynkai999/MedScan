services:
  postgresql:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: medscan
      POSTGRES_USER: medscan_owner
      POSTGRES_PASSWORD: ${MEDSCAN_DB_OWNER_PASSWORD:?Set MEDSCAN_DB_OWNER_PASSWORD in .env}
      MEDSCAN_DB_APP_PASSWORD: ${MEDSCAN_DB_APP_PASSWORD:?Set MEDSCAN_DB_APP_PASSWORD in .env}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=medscan_owner --dbname=medscan"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - medscan-internal

  migrate:
    image: flyway/flyway:11.7.2-alpine
    command:
      - -connectRetries=60
      - -connectRetriesInterval=1
      - -locations=filesystem:/flyway/sql
      - migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgresql:5432/medscan
      FLYWAY_USER: medscan_owner
      FLYWAY_PASSWORD: ${MEDSCAN_DB_OWNER_PASSWORD:?Set MEDSCAN_DB_OWNER_PASSWORD in .env}
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - medscan-internal

volumes:
  postgresql-data:

networks:
  medscan-internal:
    internal: true
