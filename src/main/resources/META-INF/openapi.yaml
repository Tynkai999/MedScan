openapi: 3.1.0
info:
  title: MedScan Enterprise API
  version: 0.1.0-SNAPSHOT
  description: >
    Security-first API for MedScan Enterprise.
    Enforces Zero Trust, OIDC/OAuth2 Bearer JWT authentication,
    multi-tenant isolation, and strict RBAC/ABAC authorization.

paths:
  /v1/health:
    get:
      summary: Returns non-sensitive service health
      operationId: getHealth
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]

  /v1/auth/login:
    post:
      summary: Authenticates an actor and issues RS256 JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: doctor@medscan.org
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, tokenType, expiresIn, user]
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 900
                  user:
                    type: object
                    required: [id, username, email, tenantId, roles]
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
                      email:
                        type: string
                      displayName:
                        type: string
                      tenantId:
                        type: string
                        format: uuid
                      tenantCode:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          description: Invalid credentials

  /v1/auth/me:
    get:
      summary: Returns profile and roles of the authenticated actor
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
        '401':
          description: Unauthorized

  /v1/auth/refresh:
    post:
      summary: Refreshes an access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token

  /v1/tenants:
    get:
      summary: List all healthcare facilities and tenant structures
      operationId: listTenants
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      summary: Register a new healthcare facility / tenant (Super-Admin only)
      operationId: createTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                code:
                  type: string
                  example: CLINIQUE_SAINT_CAMILLE
                name:
                  type: string
                  example: Clinique Saint Camille de Ouagadougou
                type:
                  type: string
                  example: CLINIC
                country:
                  type: string
                  example: Burkina Faso
                city:
                  type: string
                  example: Ouagadougou
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          description: Forbidden - Only SUPER_ADMIN allowed

  /v1/tenants/{id}:
    get:
      summary: Retrieve a healthcare facility by UUID
      operationId: getTenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant details
        '404':
          description: Tenant not found

  /v1/users:
    get:
      summary: List staff accounts within tenant or globally for platform admins
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
        '403':
          description: Forbidden
    post:
      summary: Provision a new healthcare professional or staff account (Tenant Admin / Super Admin)
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username:
                  type: string
                  example: dr.barro@ch-ouaga.bf
                email:
                  type: string
                  example: dr.barro@ch-ouaga.bf
                password:
                  type: string
                  example: Password123!
                displayName:
                  type: string
                  example: Dr. Souleymane Barro (Chirurgien)
                role:
                  type: string
                  enum: [DOCTOR, NURSE, PHARMACIST, RADIOLOGIST, LAB_TECHNICIAN, DELIVERY_AGENT, TENANT_ADMIN]
                  example: DOCTOR
                tenantId:
                  type: string
                  format: uuid
                  description: Optional for TENANT_ADMIN (defaults to admin tenant), required for SUPER_ADMIN
      responses:
        '201':
          description: Staff account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Invalid request payload
        '403':
          description: Forbidden

  /v1/patients:
    get:
      summary: Search patients within authenticated actor's tenant
      operationId: searchPatients
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search term (name, national ID, phone)
          schema:
            type: string
      responses:
        '200':
          description: Matching patients list
        '403':
          description: Forbidden
    post:
      summary: Create a new patient record
      operationId: createPatient
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Patient created

  /v1/patients/{id}:
    get:
      summary: Retrieve complete longitudinal patient health record
      operationId: getPatientRecord
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient dossier including vitals, consultations and prescriptions
        '403':
          description: Access denied by tenant isolation
    put:
      summary: Update patient demographics, biometrics, and dynamic custom fields
      description: Allows doctors and nurses to update identity, age, weight, height, blood group, allergies, and patient-specific dynamic custom fields. Automatically recalculates BMI and clinical category.
      operationId: updatePatientRecord
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                birthDate:
                  type: string
                  format: date
                age:
                  type: integer
                gender:
                  type: string
                bloodGroup:
                  type: string
                phone:
                  type: string
                emergencyContact:
                  type: string
                allergies:
                  type: array
                  items:
                    type: string
                chronicConditions:
                  type: array
                  items:
                    type: string
                weightKg:
                  type: number
                  example: 72.5
                heightCm:
                  type: number
                  example: 175.0
                customFields:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    perimetreAbdominal: "88 cm"
                    tabagisme: "0 paquet/jour"
                    profession: "Enseignant"
      responses:
        '200':
          description: Patient updated successfully with recalculated BMI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Invalid request payload or patient ID
        '403':
          description: Forbidden - role or tenant isolation violation
        '404':
          description: Patient not found

  /v1/patients/{id}/vitals:
    get:
      summary: Retrieve enriched vital signs history and emergency clinical markers
      operationId: getPatientVitals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of vital signs with blood group, allergies, SpO2, BMI and triage
        '403':
          description: Forbidden
    post:
      summary: Record vital signs for a patient
      operationId: recordVitals
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Vital signs recorded

  /v1/patients/{id}/consultations:
    post:
      summary: Record clinical consultation notes with biometrics and dynamic custom fields
      description: Record a consultation note. Accepts weight, height, blood pressure, heart rate, temperature, SpO2, and custom fields. Automatically calculates BMI and clinical category and synchronizes patient master dossier.
      operationId: recordConsultation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chiefComplaint, diagnosis]
              properties:
                chiefComplaint:
                  type: string
                examinationNotes:
                  type: string
                diagnosis:
                  type: string
                treatmentPlan:
                  type: string
                weightKg:
                  type: number
                  example: 74.0
                heightCm:
                  type: number
                  example: 175.0
                systolicBp:
                  type: integer
                  example: 120
                diastolicBp:
                  type: integer
                  example: 80
                heartRate:
                  type: integer
                  example: 72
                temperature:
                  type: number
                  example: 37.0
                oxygenSaturation:
                  type: number
                  example: 98.5
                customFields:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    perimetreAbdominal: "86 cm"
                    regimeDietetique: "Hyposodé"
      responses:
        '201':
          description: Consultation notes recorded with automatically calculated BMI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'

  /v1/patients/{id}/prescriptions:
    post:
      summary: Issue an electronic prescription
      operationId: issuePrescription
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Prescription issued

  /v1/patients/{id}/break-glass:
    post:
      summary: Emergency override for vital emergency access
      operationId: triggerBreakGlass
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Emergency access granted and audited

  /v1/patient/my-record:
    get:
      summary: Retrieve authenticated patient's own health record
      operationId: getMyRecord
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Patient's digital health record

  /v1/prescriptions/{code}:
    get:
      summary: Lookup prescription by unique code (e.g. RX-2026-0042)
      operationId: lookupPrescription
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prescription details

  /v1/prescriptions/{code}/dispense:
    post:
      summary: Dispense medication in pharmacy
      operationId: dispensePrescription
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prescription dispensed successfully
        '409':
          description: Already dispensed

  /v1/audit/logs:
    get:
      summary: Retrieve immutable audit trail logs
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit events list

  /v1/imaging/studies:
    get:
      summary: Search imaging studies within tenant
      operationId: searchImagingStudies
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of imaging studies
    post:
      summary: Upload and register a new medical imaging study
      operationId: createImagingStudy
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Imaging study created

  /v1/imaging/studies/{id}:
    get:
      summary: Retrieve an imaging study with AI predictions and radiologist report
      operationId: getImagingStudy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Imaging study details

  /v1/imaging/studies/{id}/ai-analyze:
    post:
      summary: Trigger decoupled AI clinical computer vision inference
      operationId: triggerAiInference
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: AI analysis completed with confidence score and Grad-CAM heatmap

  /v1/imaging/studies/{id}/report:
    post:
      summary: Validate and sign official radiologist report
      operationId: submitRadiologistReport
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report officially validated

  /v1/dashboard/stats:
    get:
      summary: Get consolidated actor-specific dashboard metrics, critical alerts, recent activities and trends
      operationId: getDashboardStats
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          description: Target actor role override (DOCTOR, PHARMACIST, RADIOLOGIST, NURSE, DELIVERY_AGENT, TENANT_ADMIN, PATIENT, AUDITOR)
          schema:
            type: string
      responses:
        '200':
          description: Consolidated dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorDashboardStats'
        '401':
          description: Unauthorized

  /v1/deliveries:
    get:
      summary: List delivery missions filtered by actor role and tenant
      operationId: listDeliveries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of delivery orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryOrder'
        '401':
          description: Unauthorized
    post:
      summary: Create a new pharmaceutical delivery mission
      operationId: createDelivery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prescriptionCode:
                  type: string
                patientId:
                  type: string
                  format: uuid
                patientName:
                  type: string
                patientPhone:
                  type: string
                deliveryAddress:
                  type: string
                destinationCity:
                  type: string
                pharmacyTenantId:
                  type: string
                  format: uuid
                packageDescription:
                  type: string
                specialInstructions:
                  type: string
      responses:
        '201':
          description: Delivery mission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrder'
        '400':
          description: Bad request
        '403':
          description: Forbidden

  /v1/deliveries/{id}:
    get:
      summary: Get details of a delivery mission
      operationId: getDeliveryById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrder'
        '404':
          description: Delivery not found

  /v1/deliveries/{id}/assign:
    post:
      summary: Assign delivery mission to a courier
      operationId: assignDelivery
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery mission assigned
        '403':
          description: Forbidden

  /v1/deliveries/{id}/pickup:
    post:
      summary: Courier picks up sealed medication package at pharmacy
      operationId: pickupDelivery
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package picked up, delivery is in transit

  /v1/deliveries/{id}/complete:
    post:
      summary: Finalize delivery by validating patient 6-digit OTP code
      operationId: completeDeliveryWithOtp
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  example: "482910"
                recipientConfirmation:
                  type: string
                  example: "Fatou Ouedraogo"
      responses:
        '200':
          description: Delivery successfully verified and completed
        '400':
          description: Invalid OTP code or attempts exhausted
        '409':
          description: Delivery expired or locked

  /v1/deliveries/{id}/otp:
    get:
      summary: Patient retrieves their 6-digit delivery release OTP code
      operationId: getDeliveryOtp
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OTP secret for recipient patient
        '403':
          description: Forbidden for couriers

  /v1/sync/vault:
    get:
      summary: Download offline health vault bundle with optional delta cursor
      operationId: getSyncVault
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: ISO-8601 timestamp for differential synchronization (returns only changes since this date)
          schema:
            type: string
            format: date-time
        - name: patientId
          in: query
          required: false
          description: Optional filter to pull offline vault for a single specific patient
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Offline health vault package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPackage'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /v1/sync/push:
    post:
      summary: Submit offline batch of clinical operations with strict idempotency deduplication
      operationId: pushSyncBatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Batch processing summary and optional delta sync package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /v1/sync/emergency-card/{patientId}:
    get:
      summary: Retrieve standalone emergency health card with SHA-256 tamper-evident integrity hash
      operationId: getEmergencyCard
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          description: Unique patient identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Emergency health card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyCard'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Patient not found

  /fhir/r4/metadata:
    get:
      summary: FHIR R4 CapabilityStatement (Conformité & Découverte de capacités)
      description: Découverte publique des capacités du serveur FHIR R4, profils supportés (Patient, Observation, MedicationRequest, Bundle) et sécurité OAuth2.
      operationId: getFhirMetadata
      responses:
        '200':
          description: Document CapabilityStatement conforme HL7 FHIR R4
          content:
            application/fhir+json:
              schema:
                type: object
            application/json:
              schema:
                type: object

  /fhir/r4/Patient:
    get:
      summary: Recherche de dossiers patients au format HL7 FHIR R4
      operationId: searchFhirPatients
      security:
        - BearerAuth: []
      parameters:
        - name: identifier
          in: query
          required: false
          description: Numéro national d'identification (ex. BFA-2026-008412)
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Nom ou prénom du patient
          schema:
            type: string
      responses:
        '200':
          description: Bundle FHIR de type searchset contenant les correspondances
          content:
            application/fhir+json:
              schema:
                type: object
        '401':
          description: Non authentifié
        '403':
          description: Accès interdit
    post:
      summary: Création d'un dossier patient via ressource standard HL7 FHIR R4
      operationId: createFhirPatient
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              type: object
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Patient créé avec succès au format FHIR R4
          content:
            application/fhir+json:
              schema:
                type: object
        '400':
          description: Ressource FHIR invalide
        '401':
          description: Non authentifié
        '403':
          description: Rôle insuffisant

  /fhir/r4/Patient/{id}:
    get:
      summary: Consultation d'un patient au format HL7 FHIR R4
      operationId: getFhirPatient
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant UUID du patient
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ressource Patient standard FHIR R4 avec extensions cliniques MedScan (groupe sanguin, allergies, IMC)
          content:
            application/fhir+json:
              schema:
                type: object
        '401':
          description: Non authentifié
        '403':
          description: Accès refusé
        '404':
          description: Patient introuvable

  /fhir/r4/Observation:
    get:
      summary: Recherche d'observations vitales codifiées LOINC & unités UCUM
      operationId: searchFhirObservations
      security:
        - BearerAuth: []
      parameters:
        - name: patient
          in: query
          required: true
          description: UUID du patient
          schema:
            type: string
            format: uuid
        - name: code
          in: query
          required: false
          description: Code LOINC spécifique (ex. 85354-9 tension, 8867-4 pouls, 8310-5 temp, 39156-5 IMC, 2708-6 SpO2)
          schema:
            type: string
      responses:
        '200':
          description: Bundle searchset d'Observations cliniques LOINC
          content:
            application/fhir+json:
              schema:
                type: object
        '401':
          description: Non authentifié
        '403':
          description: Accès interdit

  /fhir/r4/MedicationRequest:
    get:
      summary: Recherche des ordonnances électroniques au format FHIR R4
      operationId: searchFhirMedicationRequests
      security:
        - BearerAuth: []
      parameters:
        - name: patient
          in: query
          required: true
          description: UUID du patient
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle searchset de MedicationRequests
          content:
            application/fhir+json:
              schema:
                type: object

  /fhir/r4/MedicationRequest/{id}:
    get:
      summary: Consultation d'une ordonnance FHIR MedicationRequest
      operationId: getFhirMedicationRequest
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Code d'ordonnance ou UUID
          schema:
            type: string
      responses:
        '200':
          description: Ressource MedicationRequest FHIR R4
          content:
            application/fhir+json:
              schema:
                type: object
        '404':
          description: Ordonnance introuvable

  /fhir/r4/Bundle:
    get:
      summary: Export complet du Dossier Médical Partagé en Collection Bundle FHIR R4
      description: Exporte l'intégralité du dossier (Patient, Observations LOINC, MedicationRequests) dans un Bundle standard pour interopérabilité hospitalière (OpenMRS, DHIS2, dossiers nationaux).
      operationId: exportFhirBundle
      security:
        - BearerAuth: []
      parameters:
        - name: patient
          in: query
          required: true
          description: UUID du patient
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle de type collection contenant toutes les ressources cliniques du patient
          content:
            application/fhir+json:
              schema:
                type: object
        '401':
          description: Non authentifié
        '403':
          description: Accès interdit
        '404':
          description: Patient introuvable

  /v1/appointments:
    get:
      summary: Lister les rendez-vous et séances de téléconsultation
      operationId: listAppointments
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: practitionerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste ordonnée chronologiquement des rendez-vous
          content:
            application/json:
              schema:
                type: array
    post:
      summary: Planifier un nouveau rendez-vous (présentiel ou téléconsultation avec lien Jitsi)
      operationId: createAppointment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId]
              properties:
                patientId:
                  type: string
                  format: uuid
                practitionerId:
                  type: string
                  format: uuid
                practitionerName:
                  type: string
                practitionerRole:
                  type: string
                  enum: [DOCTOR, LAB_TECHNICIAN, RADIOLOGIST, NURSE]
                appointmentType:
                  type: string
                  enum: [IN_PERSON, TELECONSULTATION, LAB_ANALYSIS, IMAGING, NURSING]
                scheduledAt:
                  type: string
                  format: date-time
                durationMinutes:
                  type: integer
                reason:
                  type: string
      responses:
        '201':
          description: Rendez-vous planifié avec succès
          content:
            application/json:
              schema:
                type: object

  /v1/appointments/{id}/confirm:
    post:
      summary: Confirmer un rendez-vous planifié
      operationId: confirmAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rendez-vous confirmé

  /v1/appointments/{id}/cancel:
    post:
      summary: Annuler un rendez-vous avec motif
      operationId: cancelAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rendez-vous annulé

  /v1/appointments/{id}/complete:
    post:
      summary: Clôturer un rendez-vous honoré avec notes cliniques
      operationId: completeAppointment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Rendez-vous clôturé

  /v1/lab/orders:
    get:
      summary: Lister les prescriptions et analyses de biologie médicale
      operationId: listLabOrders
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: pending
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Liste des analyses biologiques
    post:
      summary: Prescrire une analyse biologique médicale (Réservé Médecin)
      operationId: createLabOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, testName]
              properties:
                patientId:
                  type: string
                  format: uuid
                testCategory:
                  type: string
                  enum: [HEMATOLOGY, PARASITOLOGY, BIOCHEMISTRY, IMMUNOLOGY, URINARY]
                testName:
                  type: string
                priority:
                  type: string
                  enum: [ROUTINE, URGENT, STAT]
                clinicalIndication:
                  type: string
      responses:
        '201':
          description: Analyse biologique prescrite

  /v1/lab/orders/{id}/collect-sample:
    post:
      summary: Enregistrer le prélèvement de l'échantillon biologique
      operationId: collectLabSample
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statut mis à jour à SAMPLE_COLLECTED

  /v1/lab/orders/{id}/validate-results:
    post:
      summary: Valider et publier les résultats d'analyses (Technicien Labo / Médecin)
      operationId: validateLabResults
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Résultats enregistrés et validés

  /v1/lab/orders/{id}/fhir:
    get:
      summary: Exporter l'analyse au format standard HL7 FHIR R4 Laboratory Observation
      operationId: exportLabOrderFhir
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bundle FHIR d'observations biologiques codifiées LOINC
          content:
            application/fhir+json:
              schema:
                type: object

  /v1/epidemiology/cases:
    get:
      summary: Lister les cas épidémiologiques sous surveillance (Paludisme, Dengue, Rougeole, etc.)
      operationId: listEpidemiologyCases
      security:
        - BearerAuth: []
      parameters:
        - name: diseaseCode
          in: query
          required: false
          schema:
            type: string
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Liste des cas déclarés
    post:
      summary: Déclaration obligatoire d'un cas épidémiologique
      operationId: reportEpidemiologyCase
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, district, diseaseCode]
              properties:
                region:
                  type: string
                district:
                  type: string
                diseaseCode:
                  type: string
                diseaseName:
                  type: string
                detectionSource:
                  type: string
                patientAge:
                  type: integer
                patientGender:
                  type: string
                outcome:
                  type: string
      responses:
        '201':
          description: Cas épidémiologique enregistré

  /v1/epidemiology/summary:
    get:
      summary: Tableau de bord et synthèse épidémiologique régionale avec alertes de seuils
      operationId: getEpidemiologySummary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métriques régionales et alertes épidémiques actives

  /v1/epidemiology/dhis2-export:
    get:
      summary: Exportation conforme au standard international DHIS2 DataValueSet JSON
      operationId: exportDhis2Data
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            example: 2026W42
        - name: orgUnit
          in: query
          required: false
          schema:
            type: string
            example: ou-bfa-centre-01
      responses:
        '200':
          description: Fichier DataValueSet DHIS2

  /v1/messages:
    get:
      summary: Lister les messages sécurisés reçus et émis par l'utilisateur connecté
      operationId: listMessages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste des messages
    post:
      summary: Envoyer un message clinique sécurisé (auto-notifie le destinataire)
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, content]
              properties:
                conversationId:
                  type: string
                  format: uuid
                recipientId:
                  type: string
                  format: uuid
                recipientName:
                  type: string
                recipientRole:
                  type: string
                patientId:
                  type: string
                  format: uuid
                subject:
                  type: string
                content:
                  type: string
                priority:
                  type: string
                  enum: [ROUTINE, URGENT, EMERGENCY]
      responses:
        '201':
          description: Message envoyé et notification générée

  /v1/messages/conversation/{conversationId}:
    get:
      summary: Récupérer l'historique complet d'une conversation clinique
      operationId: getConversationMessages
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fil de discussion ordonné

  /v1/notifications:
    get:
      summary: Récupérer les alertes et notifications multi-entités de l'utilisateur
      operationId: listNotifications
      security:
        - BearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Liste des alertes et notifications

  /v1/notifications/unread-count:
    get:
      summary: Obtenir le nombre de notifications non lues (Badge UI)
      operationId: getUnreadNotificationCount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Nombre d'alertes non lues
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer

  /v1/notifications/mark-all-read:
    post:
      summary: Marquer toutes les notifications comme lues
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Toutes les notifications marquées comme lues

  /v1/notifications/{id}/read:
    post:
      summary: Marquer une notification spécifique comme lue
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marquée comme lue

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: CH_OUAGADOUGOU
        name:
          type: string
          example: Centre Hospitalier Universitaire de Ouagadougou
        type:
          type: string
          example: HOSPITAL
        country:
          type: string
          example: Burkina Faso
        city:
          type: string
          example: Ouagadougou
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time

    UserAccount:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          example: dr.barro@ch-ouaga.bf
        email:
          type: string
          example: dr.barro@ch-ouaga.bf
        displayName:
          type: string
          example: Dr. Souleymane Barro (Chirurgien)
        tenantId:
          type: string
          format: uuid
        tenantCode:
          type: string
          example: CH_OUAGADOUGOU
        roles:
          type: array
          items:
            type: string
          example: ["DOCTOR"]
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
          example: ACTIVE

    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nationalId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        birthDate:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        bloodGroup:
          type: string
        phone:
          type: string
        emergencyContact:
          type: string
        allergies:
          type: array
          items:
            type: string
        chronicConditions:
          type: array
          items:
            type: string
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
          description: Automatically calculated Body Mass Index
        bmiCategory:
          type: string
          description: Clinical classification (Corpulence normale, Surpoids, etc.)
        customFields:
          type: object
          additionalProperties:
            type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Consultation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        doctorName:
          type: string
        tenantId:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        chiefComplaint:
          type: string
        examinationNotes:
          type: string
        diagnosis:
          type: string
        treatmentPlan:
          type: string
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
          description: Automatically calculated Body Mass Index
        bmiCategory:
          type: string
        systolicBp:
          type: integer
        diastolicBp:
          type: integer
        heartRate:
          type: integer
        temperature:
          type: number
        oxygenSaturation:
          type: number
        customFields:
          type: object
          additionalProperties:
            type: string

    VitalSigns:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        systolicBp:
          type: integer
        diastolicBp:
          type: integer
        heartRate:
          type: integer
        temperature:
          type: number
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
        bloodGlucose:
          type: number
        oxygenSaturation:
          type: number
          description: SpO2 in percent
        respiratoryRate:
          type: integer
        painScale:
          type: integer
        bloodGroup:
          type: string
          example: A+
        allergies:
          type: array
          items:
            type: string
          example: ["Pénicilline", "Arachide"]
        chronicConditions:
          type: array
          items:
            type: string
          example: ["Asthme léger"]
        emergencyContact:
          type: string
          example: Moussa Ouedraogo (+226 76 11 22 33)
        triageLevel:
          type: string
          enum: [NORMAL, ATTENTION, CRITICAL]
        notes:
          type: string
        recordedBy:
          type: string
        recordedByRole:
          type: string

    ActorDashboardStats:
      type: object
      properties:
        role:
          type: string
        userId:
          type: string
          format: uuid
        username:
          type: string
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        kpis:
          type: object
        criticalAlerts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              patientId:
                type: string
              patientName:
                type: string
              alertType:
                type: string
              severity:
                type: string
              summary:
                type: string
              recordedAt:
                type: string
        recentActivities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              timestamp:
                type: string
              activityType:
                type: string
              title:
                type: string
              description:
                type: string
              actorName:
                type: string
              status:
                type: string
        chartsData:
          type: object

    DeliveryOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deliveryCode:
          type: string
          example: DEL-2026-0089
        prescriptionCode:
          type: string
          example: RX-2026-0042
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        patientPhone:
          type: string
        deliveryAddress:
          type: string
        destinationCity:
          type: string
        pharmacyTenantId:
          type: string
          format: uuid
        pharmacyName:
          type: string
        logisticsTenantId:
          type: string
          format: uuid
        deliveryAgentId:
          type: string
          format: uuid
        deliveryAgentName:
          type: string
        status:
          type: string
          enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, FAILED, CANCELLED]
        packageDescription:
          type: string
        specialInstructions:
          type: string
        otpRequired:
          type: boolean
        otpCode:
          type: string
          description: Only visible to authorized patient recipient
        otpAttemptsRemaining:
          type: integer
        otpExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
        pickedUpAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        recipientConfirmation:
          type: string
        failureReason:
          type: string

    EmergencyCard:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        nationalId:
          type: string
        fullName:
          type: string
        gender:
          type: string
        birthDate:
          type: string
        age:
          type: integer
        bloodGroup:
          type: string
        allergies:
          type: array
          items:
            type: string
        chronicConditions:
          type: array
          items:
            type: string
        emergencyContact:
          type: string
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
        bmiCategory:
          type: string
        lastBloodPressure:
          type: string
        lastHeartRate:
          type: integer
        lastOxygenSaturation:
          type: number
        lastTriageLevel:
          type: string
        lastVitalsRecordedAt:
          type: string
          format: date-time
        activePrescriptionsCount:
          type: integer
        generatedAt:
          type: string
          format: date-time
        integrityHash:
          type: string
          description: Cryptographic SHA-256 hash ensuring offline card has not been tampered with

    SyncOperation:
      type: object
      required:
        - operationId
        - entityType
        - action
      properties:
        operationId:
          type: string
          format: uuid
        entityType:
          type: string
          enum: [PATIENT, VITAL_SIGNS, CONSULTATION, PRESCRIPTION]
        action:
          type: string
          enum: [CREATE, UPDATE]
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object

    SyncOperationResult:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APPLIED, DUPLICATE_IGNORED, REJECTED, CONFLICT_RESOLVED]
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        message:
          type: string

    SyncBatchRequest:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        deviceId:
          type: string
        clientTimestamp:
          type: string
          format: date-time
        pullSince:
          type: string
          format: date-time
          description: Optional timestamp to receive differential updates in the same round-trip
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'

    SyncBatchResponse:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        processedAt:
          type: string
          format: date-time
        totalOperations:
          type: integer
        appliedCount:
          type: integer
        duplicateCount:
          type: integer
        errorCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperationResult'
        delta:
          $ref: '#/components/schemas/SyncPackage'

    SyncPackage:
      type: object
      properties:
        syncTimestamp:
          type: string
          format: date-time
        sinceTimestamp:
          type: string
          format: date-time
        totalRecords:
          type: integer
        patients:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
        vitalSigns:
          type: array
          items:
            $ref: '#/components/schemas/VitalSigns'
        consultations:
          type: array
          items:
            $ref: '#/components/schemas/Consultation'
        prescriptions:
          type: array
          items:
            $ref: '#/components/schemas/Prescription'
        emergencyCards:
          type: array
          items:
            $ref: '#/components/schemas/EmergencyCard'
