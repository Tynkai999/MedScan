openapi: 3.1.0
info:
  title: MedScan Enterprise API
  version: 0.1.0-SNAPSHOT
  description: >
    Security-first API for MedScan Enterprise.
    Enforces Zero Trust, OIDC/OAuth2 Bearer JWT authentication,
    multi-tenant isolation, and strict RBAC/ABAC authorization.

paths:
  /v1/health:
    get:
      summary: Returns non-sensitive service health
      operationId: getHealth
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]

  /v1/auth/login:
    post:
      summary: Authenticates an actor and issues RS256 JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: doctor@medscan.org
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, tokenType, expiresIn, user]
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: integer
                    example: 900
                  user:
                    type: object
                    required: [id, username, email, tenantId, roles]
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
                      email:
                        type: string
                      displayName:
                        type: string
                      tenantId:
                        type: string
                        format: uuid
                      tenantCode:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          description: Invalid credentials

  /v1/auth/me:
    get:
      summary: Returns profile and roles of the authenticated actor
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
        '401':
          description: Unauthorized

  /v1/auth/refresh:
    post:
      summary: Refreshes an access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token

  /v1/tenants:
    get:
      summary: List all healthcare facilities and tenant structures
      operationId: listTenants
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      summary: Register a new healthcare facility / tenant (Super-Admin only)
      operationId: createTenant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                code:
                  type: string
                  example: CLINIQUE_SAINT_CAMILLE
                name:
                  type: string
                  example: Clinique Saint Camille de Ouagadougou
                type:
                  type: string
                  example: CLINIC
                country:
                  type: string
                  example: Burkina Faso
                city:
                  type: string
                  example: Ouagadougou
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          description: Forbidden - Only SUPER_ADMIN allowed

  /v1/tenants/{id}:
    get:
      summary: Retrieve a healthcare facility by UUID
      operationId: getTenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant details
        '404':
          description: Tenant not found

  /v1/users:
    get:
      summary: List staff accounts within tenant or globally for platform admins
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccount'
        '403':
          description: Forbidden
    post:
      summary: Provision a new healthcare professional or staff account (Tenant Admin / Super Admin)
      operationId: createUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username:
                  type: string
                  example: dr.barro@ch-ouaga.bf
                email:
                  type: string
                  example: dr.barro@ch-ouaga.bf
                password:
                  type: string
                  example: Password123!
                displayName:
                  type: string
                  example: Dr. Souleymane Barro (Chirurgien)
                role:
                  type: string
                  enum: [DOCTOR, NURSE, PHARMACIST, RADIOLOGIST, LAB_TECHNICIAN, DELIVERY_AGENT, TENANT_ADMIN]
                  example: DOCTOR
                tenantId:
                  type: string
                  format: uuid
                  description: Optional for TENANT_ADMIN (defaults to admin tenant), required for SUPER_ADMIN
      responses:
        '201':
          description: Staff account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          description: Invalid request payload
        '403':
          description: Forbidden

  /v1/patients:
    get:
      summary: Search patients within authenticated actor's tenant
      operationId: searchPatients
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search term (name, national ID, phone)
          schema:
            type: string
      responses:
        '200':
          description: Matching patients list
        '403':
          description: Forbidden
    post:
      summary: Create a new patient record
      operationId: createPatient
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Patient created

  /v1/patients/{id}:
    get:
      summary: Retrieve complete longitudinal patient health record
      operationId: getPatientRecord
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient dossier including vitals, consultations and prescriptions
        '403':
          description: Access denied by tenant isolation
    put:
      summary: Update patient demographics, biometrics, and dynamic custom fields
      description: Allows doctors and nurses to update identity, age, weight, height, blood group, allergies, and patient-specific dynamic custom fields. Automatically recalculates BMI and clinical category.
      operationId: updatePatientRecord
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                birthDate:
                  type: string
                  format: date
                age:
                  type: integer
                gender:
                  type: string
                bloodGroup:
                  type: string
                phone:
                  type: string
                emergencyContact:
                  type: string
                allergies:
                  type: array
                  items:
                    type: string
                chronicConditions:
                  type: array
                  items:
                    type: string
                weightKg:
                  type: number
                  example: 72.5
                heightCm:
                  type: number
                  example: 175.0
                customFields:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    perimetreAbdominal: "88 cm"
                    tabagisme: "0 paquet/jour"
                    profession: "Enseignant"
      responses:
        '200':
          description: Patient updated successfully with recalculated BMI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          description: Invalid request payload or patient ID
        '403':
          description: Forbidden - role or tenant isolation violation
        '404':
          description: Patient not found

  /v1/patients/{id}/vitals:
    get:
      summary: Retrieve enriched vital signs history and emergency clinical markers
      operationId: getPatientVitals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of vital signs with blood group, allergies, SpO2, BMI and triage
        '403':
          description: Forbidden
    post:
      summary: Record vital signs for a patient
      operationId: recordVitals
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Vital signs recorded

  /v1/patients/{id}/consultations:
    post:
      summary: Record clinical consultation notes with biometrics and dynamic custom fields
      description: Record a consultation note. Accepts weight, height, blood pressure, heart rate, temperature, SpO2, and custom fields. Automatically calculates BMI and clinical category and synchronizes patient master dossier.
      operationId: recordConsultation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chiefComplaint, diagnosis]
              properties:
                chiefComplaint:
                  type: string
                examinationNotes:
                  type: string
                diagnosis:
                  type: string
                treatmentPlan:
                  type: string
                weightKg:
                  type: number
                  example: 74.0
                heightCm:
                  type: number
                  example: 175.0
                systolicBp:
                  type: integer
                  example: 120
                diastolicBp:
                  type: integer
                  example: 80
                heartRate:
                  type: integer
                  example: 72
                temperature:
                  type: number
                  example: 37.0
                oxygenSaturation:
                  type: number
                  example: 98.5
                customFields:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    perimetreAbdominal: "86 cm"
                    regimeDietetique: "Hyposodé"
      responses:
        '201':
          description: Consultation notes recorded with automatically calculated BMI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'

  /v1/patients/{id}/prescriptions:
    post:
      summary: Issue an electronic prescription
      operationId: issuePrescription
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Prescription issued

  /v1/patients/{id}/break-glass:
    post:
      summary: Emergency override for vital emergency access
      operationId: triggerBreakGlass
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Emergency access granted and audited

  /v1/patient/my-record:
    get:
      summary: Retrieve authenticated patient's own health record
      operationId: getMyRecord
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Patient's digital health record

  /v1/prescriptions/{code}:
    get:
      summary: Lookup prescription by unique code (e.g. RX-2026-0042)
      operationId: lookupPrescription
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prescription details

  /v1/prescriptions/{code}/dispense:
    post:
      summary: Dispense medication in pharmacy
      operationId: dispensePrescription
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prescription dispensed successfully
        '409':
          description: Already dispensed

  /v1/audit/logs:
    get:
      summary: Retrieve immutable audit trail logs
      operationId: getAuditLogs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Audit events list

  /v1/imaging/studies:
    get:
      summary: Search imaging studies within tenant
      operationId: searchImagingStudies
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of imaging studies
    post:
      summary: Upload and register a new medical imaging study
      operationId: createImagingStudy
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Imaging study created

  /v1/imaging/studies/{id}:
    get:
      summary: Retrieve an imaging study with AI predictions and radiologist report
      operationId: getImagingStudy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Imaging study details

  /v1/imaging/studies/{id}/ai-analyze:
    post:
      summary: Trigger decoupled AI clinical computer vision inference
      operationId: triggerAiInference
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: AI analysis completed with confidence score and Grad-CAM heatmap

  /v1/imaging/studies/{id}/report:
    post:
      summary: Validate and sign official radiologist report
      operationId: submitRadiologistReport
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report officially validated

  /v1/dashboard/stats:
    get:
      summary: Get consolidated actor-specific dashboard metrics, critical alerts, recent activities and trends
      operationId: getDashboardStats
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          description: Target actor role override (DOCTOR, PHARMACIST, RADIOLOGIST, NURSE, DELIVERY_AGENT, TENANT_ADMIN, PATIENT, AUDITOR)
          schema:
            type: string
      responses:
        '200':
          description: Consolidated dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorDashboardStats'
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: CH_OUAGADOUGOU
        name:
          type: string
          example: Centre Hospitalier Universitaire de Ouagadougou
        type:
          type: string
          example: HOSPITAL
        country:
          type: string
          example: Burkina Faso
        city:
          type: string
          example: Ouagadougou
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time

    UserAccount:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          example: dr.barro@ch-ouaga.bf
        email:
          type: string
          example: dr.barro@ch-ouaga.bf
        displayName:
          type: string
          example: Dr. Souleymane Barro (Chirurgien)
        tenantId:
          type: string
          format: uuid
        tenantCode:
          type: string
          example: CH_OUAGADOUGOU
        roles:
          type: array
          items:
            type: string
          example: ["DOCTOR"]
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
          example: ACTIVE

    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nationalId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        birthDate:
          type: string
          format: date
        age:
          type: integer
        gender:
          type: string
        bloodGroup:
          type: string
        phone:
          type: string
        emergencyContact:
          type: string
        allergies:
          type: array
          items:
            type: string
        chronicConditions:
          type: array
          items:
            type: string
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
          description: Automatically calculated Body Mass Index
        bmiCategory:
          type: string
          description: Clinical classification (Corpulence normale, Surpoids, etc.)
        customFields:
          type: object
          additionalProperties:
            type: string
        tenantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Consultation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        doctorName:
          type: string
        tenantId:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        chiefComplaint:
          type: string
        examinationNotes:
          type: string
        diagnosis:
          type: string
        treatmentPlan:
          type: string
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
          description: Automatically calculated Body Mass Index
        bmiCategory:
          type: string
        systolicBp:
          type: integer
        diastolicBp:
          type: integer
        heartRate:
          type: integer
        temperature:
          type: number
        oxygenSaturation:
          type: number
        customFields:
          type: object
          additionalProperties:
            type: string

    VitalSigns:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
        systolicBp:
          type: integer
        diastolicBp:
          type: integer
        heartRate:
          type: integer
        temperature:
          type: number
        weightKg:
          type: number
        heightCm:
          type: number
        bmi:
          type: number
        bloodGlucose:
          type: number
        oxygenSaturation:
          type: number
          description: SpO2 in percent
        respiratoryRate:
          type: integer
        painScale:
          type: integer
        bloodGroup:
          type: string
          example: A+
        allergies:
          type: array
          items:
            type: string
          example: ["Pénicilline", "Arachide"]
        chronicConditions:
          type: array
          items:
            type: string
          example: ["Asthme léger"]
        emergencyContact:
          type: string
          example: Moussa Ouedraogo (+226 76 11 22 33)
        triageLevel:
          type: string
          enum: [NORMAL, ATTENTION, CRITICAL]
        notes:
          type: string
        recordedBy:
          type: string
        recordedByRole:
          type: string

    ActorDashboardStats:
      type: object
      properties:
        role:
          type: string
        userId:
          type: string
          format: uuid
        username:
          type: string
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        kpis:
          type: object
        criticalAlerts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              patientId:
                type: string
              patientName:
                type: string
              alertType:
                type: string
              severity:
                type: string
              summary:
                type: string
              recordedAt:
                type: string
        recentActivities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              timestamp:
                type: string
              activityType:
                type: string
              title:
                type: string
              description:
                type: string
              actorName:
                type: string
              status:
                type: string
        chartsData:
          type: object
